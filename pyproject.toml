[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-trading-ai"
version = "0.1.0"
description = "Adaptive cycle-aware trading AI framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "pywavelets",
  "scikit-learn",
  "statsmodels",
  "torch",
  "matplotlib",
  "hmmlearn",
  "xgboost",
  "lightgbm",
]

[tool.setuptools.packages.find]
where = ["src"]
